name: Fiyat Avcısı v3 - Amazon Türkiye

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:
  schedule:
    # Türkiye saati 00:15 / 06:15 / 12:15 / 18:15; GitHub gecikebilir.
    - cron: '15 21,3,9,15 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fiyat-avcisi-pages
  cancel-in-progress: false

jobs:
  amazon-yayin:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testleri çalıştır
        run: python -m unittest discover -s tests -p 'test_amazon.py' -v
      - name: Amazon kataloğunu ve fiyatlarını yenile
        env:
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
        run: python cloud_publish.py
      - name: Amazon ASIN kataloğunu kaydet
        run: |
          git config user.name 'fiyat-avcisi-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/amazon_catalog.json data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Amazon katalog senkronizasyonu'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Web dosyalarını hazırla
        run: python build_site.py
      - uses: actions/configure-pages@v5
      - name: Pages artefaktı oluştur
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: GitHub Pages'e yayınla
        uses: actions/deploy-pages@v4
        id: deployment
